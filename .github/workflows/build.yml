name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (build.bat / csc)
        shell: cmd
        run: cmd /c build.bat

      - name: Self-test (offline, hard gate)
        shell: pwsh
        run: |
          $flags = @('treeself','layoutself','addonself','dupself','safeself','workshopself','launchself','tweakself','gallerself','deskself')
          $bad = 0
          foreach ($f in $flags) {
            Write-Output "=== --$f ==="
            $p = Start-Process -FilePath ".\L4D2LocalSetup.exe" -ArgumentList "--$f" -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { Write-Output "FAILED: --$f (exit $($p.ExitCode))"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad self-test group(s) failed" }

      - name: Hash
        shell: pwsh
        run: |
          $h = (Get-FileHash ./L4D2LocalSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  L4D2LocalSetup.exe" | Out-File -Encoding ascii L4D2LocalSetup.exe.sha256
          Write-Output $h

      - uses: actions/upload-artifact@v4
        with:
          name: L4D2LocalSetup
          path: L4D2LocalSetup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" L4D2LocalSetup.exe L4D2LocalSetup.exe.sha256 --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "local build ${{ github.ref_name }}: built by GitHub Actions from the same commit."